services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      SQLITE_PATH: /app/data/loggo.db
      STORAGE_BACKEND: local
      STORAGE_PATH: /app/data
      # Swap the two lines above for S3-compatible storage instead:
      # STORAGE_BACKEND: s3
      # S3_BUCKET: loggo
      # S3_ENDPOINT: https://your-s3-endpoint
      # S3_ACCESS_KEY_ID: ...
      # S3_SECRET_ACCESS_KEY: ...
    volumes:
      - ./data:/app/data
    restart: unless-stopped
